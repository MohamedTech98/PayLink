<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1349px;height:598px;background:#FFFFFF;" width="1349px" height="598px" viewBox="0 0 1349 598" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="461.967" y="22.995" fill="#000" font-size="14" textLength="419.016" font-weight="700">PayLink - Payment Lifecycle State Machine (Phase 1)</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="11"><ellipse cx="16.95" cy="146.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Initiated" id="ent0002" data-source-line="11"><rect x="86.95" y="121.297" width="77.839" height="50" fill="#FFF" style="stroke:#333;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="86.95" y1="147.594" x2="164.789" y2="147.594" style="stroke:#333;stroke-width:0.5;"/><text x="96.95" y="139.292" fill="#111" font-size="14" textLength="57.839">Initiated</text></g><g class="entity" data-qualified-name="Rejected" id="ent0004" data-source-line="13"><rect x="390.45" y="44.297" width="81.53" height="50" fill="#FFF" style="stroke:#333;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="390.45" y1="70.594" x2="471.98" y2="70.594" style="stroke:#333;stroke-width:0.5;"/><text x="400.45" y="62.292" fill="#111" font-size="14" textLength="61.53">Rejected</text></g><g class="entity" data-qualified-name="FundsHeld" id="ent0006" data-source-line="14"><rect x="224.95" y="160.297" width="93.896" height="50" fill="#FFF" style="stroke:#333;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="224.95" y1="186.594" x2="318.846" y2="186.594" style="stroke:#333;stroke-width:0.5;"/><text x="234.95" y="178.292" fill="#111" font-size="14" textLength="73.896">FundsHeld</text></g><g class="entity" data-qualified-name="SentToBiller" id="ent0008" data-source-line="15"><rect x="378.95" y="163.297" width="104.622" height="50" fill="#FFF" style="stroke:#333;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="378.95" y1="189.594" x2="483.572" y2="189.594" style="stroke:#333;stroke-width:0.5;"/><text x="388.95" y="181.292" fill="#111" font-size="14" textLength="84.622">SentToBiller</text></g><g class="entity" data-qualified-name="Completed" id="ent0010" data-source-line="16"><rect x="847.45" y="458.297" width="96.357" height="50" fill="#FFF" style="stroke:#333;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="847.45" y1="484.594" x2="943.807" y2="484.594" style="stroke:#333;stroke-width:0.5;"/><text x="857.45" y="476.292" fill="#111" font-size="14" textLength="76.357">Completed</text></g><g class="entity" data-qualified-name="Failed" id="ent0012" data-source-line="17"><rect x="864.45" y="100.297" width="61.911" height="50" fill="#FFF" style="stroke:#333;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="864.45" y1="126.594" x2="926.361" y2="126.594" style="stroke:#333;stroke-width:0.5;"/><text x="874.45" y="118.292" fill="#111" font-size="14" textLength="41.911">Failed</text></g><g class="entity" data-qualified-name="Unknown" id="ent0014" data-source-line="18"><rect x="543.95" y="214.297" width="84.989" height="50" fill="#FFF" style="stroke:#333;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="543.95" y1="240.594" x2="628.939" y2="240.594" style="stroke:#333;stroke-width:0.5;"/><text x="553.95" y="232.292" fill="#111" font-size="14" textLength="64.989">Unknown</text></g><g class="entity" data-qualified-name="Refunded" id="ent0018" data-source-line="21"><rect x="1161.95" y="100.297" width="87.402" height="50" fill="#FFF" style="stroke:#333;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="1161.95" y1="126.594" x2="1249.352" y2="126.594" style="stroke:#333;stroke-width:0.5;"/><text x="1171.95" y="118.292" fill="#111" font-size="14" textLength="67.402">Refunded</text></g><g class="end_entity" data-qualified-name=".end." id="ent0020" data-source-line="23"><ellipse cx="1319.95" cy="125.297" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1319.95" cy="125.297" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN24" id="ent0025" data-source-line="28"><path d="M688.95,185.797 L688.95,235.297 L629.09,239.297 L688.95,243.297 L688.95,316.859 A0,0 0 0 0 688.95,316.859 L1101.467,316.859 A0,0 0 0 0 1101.467,316.859 L1101.467,195.797 L1091.467,185.797 L688.95,185.797 A0,0 0 0 0 688.95,185.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1091.467,185.797 L1091.467,195.797 L1101.467,195.797 L1091.467,185.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="694.95" y="202.864" fill="#000" font-size="13" textLength="330.713">Funds remain held while the outcome is uncertain.</text><text x="694.95" y="217.997" fill="#000" font-size="13" textLength="391.517">Re-query after 1, 5 and 15 minutes from entering Unknown.</text><text x="694.95" y="233.129" fill="#000" font-size="13" textLength="382.37">After three unsuccessful re-queries, wait for reconciliation.</text><text x="694.95" y="248.262" fill="#000" font-size="13" textLength="246.911">Never refund Unknown automatically.</text><text x="694.95" y="263.395" fill="#000" font-size="13"> </text><text x="694.95" y="278.528" fill="#000" font-size="13" textLength="378.46">TopUpNet's "accepted" response is not final; the payment</text><text x="694.95" y="293.661" fill="#000" font-size="13" textLength="357.589">remains SentToBiller until the callback. A callback-wait</text><text x="694.95" y="308.793" fill="#000" font-size="13" textLength="318.487">timeout is an open configurable policy (AMB-16).</text></g><g class="entity" data-qualified-name="GMN27" id="ent0028" data-source-line="39"><path d="M690.45,351.797 L690.45,422.328 L1100.917,422.328 L1100.917,361.797 L1090.917,351.797 L690.45,351.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1090.917,351.797 L1090.917,361.797 L1100.917,361.797 L1090.917,351.797" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="696.45" y="368.864" fill="#000" font-size="13" textLength="389.467">The hold release must succeed before Refunded is entered.</text><text x="696.45" y="383.997" fill="#000" font-size="13" textLength="374.328">This is an automatic release after confirmed biller failure,</text><text x="696.45" y="399.129" fill="#000" font-size="13" textLength="350.232">not the separate FR-27 customer refund request for a</text><text x="696.45" y="414.262" fill="#000" font-size="13" textLength="354.275">Completed payment. Completed remains a final state.</text></g><g class="entity" data-qualified-name="GMN30" id="ent0031" data-source-line="46"><path d="M696.95,543.297 L696.95,583.563 A0,0 0 0 0 696.95,583.563 L1093.503,583.563 A0,0 0 0 0 1093.503,583.563 L1093.503,553.297 L1083.503,543.297 L899.95,543.297 L895.95,508.607 L891.95,543.297 L696.95,543.297 A0,0 0 0 0 696.95,543.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1083.503,543.297 L1083.503,553.297 L1093.503,553.297 L1083.503,543.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="702.95" y="560.364" fill="#000" font-size="13" textLength="337.162">Completed, Rejected and Refunded are final states.</text><text x="702.95" y="575.497" fill="#000" font-size="13" textLength="375.553">No Completed -> Refunded lifecycle transition is allowed.</text></g><!--link *start* to Initiated--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="11" data-link-type="dependency"><path d="M27.01,146.297 C40.51,146.297 60.24,146.297 81.6,146.297" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Initiated"/><polygon points="86.6,146.297,77.6,142.297,81.6,146.297,77.6,150.297,86.6,146.297" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Initiated to Rejected--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="13" data-link-type="dependency"><path d="M165.02,144.497 C247.51,144.497 431.95,144.497 431.95,144.497 C431.95,144.497 431.95,121.217 431.95,99.337" style="stroke:#181818;stroke-width:1;" fill="none" id="Initiated-to-Rejected"/><polygon points="431.95,94.337,427.95,103.337,431.95,99.337,435.95,103.337,431.95,94.337" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="203.18" y="125.564" fill="#000" font-size="13" textLength="110.145">Fraud check fails</text><text x="193.57" y="140.697" fill="#000" font-size="13" textLength="129.365">or funds insufficient</text></g><!--link Initiated to FundsHeld--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk7" data-source-line="14" data-link-type="dependency"><path d="M165.08,165.797 C183.49,165.797 200.6,165.797 219.92,165.797" style="stroke:#181818;stroke-width:1;" fill="none" id="Initiated-to-FundsHeld"/><polygon points="224.92,165.797,215.92,161.797,219.92,165.797,215.92,169.797,224.92,165.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="40.871" y="178.864" fill="#000" font-size="13" textLength="120.142">Fraud checks pass</text><text x="7" y="193.997" fill="#000" font-size="13" textLength="187.884">and wallet has enough funds</text></g><!--link FundsHeld to SentToBiller--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" id="lnk9" data-source-line="15" data-link-type="dependency"><path d="M319.38,186.797 C338.11,186.797 354.71,186.797 373.91,186.797" style="stroke:#181818;stroke-width:1;" fill="none" id="FundsHeld-to-SentToBiller"/><polygon points="378.91,186.797,369.91,182.797,373.91,186.797,369.91,190.797,378.91,186.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="205.15" y="199.864" fill="#000" font-size="13" textLength="143.571">Payment request sent</text></g><!--link SentToBiller to Completed--><g class="link" data-entity-1="ent0008" data-entity-2="ent0010" id="lnk11" data-source-line="16" data-link-type="dependency"><path d="M431.95,213.377 C431.95,286.057 431.95,491.627 431.95,491.627 C431.95,491.627 723.45,491.627 842.16,491.627" style="stroke:#181818;stroke-width:1;" fill="none" id="SentToBiller-to-Completed"/><polygon points="847.16,491.627,838.16,487.627,842.16,491.627,838.16,495.627,847.16,491.627" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="406.43" y="504.694" fill="#000" font-size="13" textLength="93.539">Biller confirms</text></g><!--link SentToBiller to Failed--><g class="link" data-entity-1="ent0008" data-entity-2="ent0012" id="lnk13" data-source-line="17" data-link-type="dependency"><path d="M478.95,163.047 C478.95,146.197 478.95,127.097 478.95,127.097 C478.95,127.097 762.29,127.097 859.15,127.097" style="stroke:#181818;stroke-width:1;" fill="none" id="SentToBiller-to-Failed"/><polygon points="864.15,127.097,855.15,123.097,859.15,127.097,855.15,131.097,864.15,127.097" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="568.57" y="140.164" fill="#000" font-size="13" textLength="84.932">Biller refuses</text></g><!--link SentToBiller to Unknown--><g class="link" data-entity-1="ent0008" data-entity-2="ent0014" id="lnk15" data-source-line="18" data-link-type="dependency"><path d="M484.14,199.547 C524.37,199.547 572.95,199.547 572.95,199.547 C572.95,199.547 572.95,201.107 572.95,208.897" style="stroke:#181818;stroke-width:1;" fill="none" id="SentToBiller-to-Unknown"/><polygon points="572.95,213.897,576.95,204.897,572.95,208.897,568.95,204.897,572.95,213.897" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="536.72" y="180.614" fill="#000" font-size="13" textLength="190.271">No answer within 10 seconds</text><text x="597.045" y="195.747" fill="#000" font-size="13" textLength="69.621">(live biller)</text></g><!--link Unknown to Completed--><g class="link" data-entity-1="ent0014" data-entity-2="ent0010" id="lnk16" data-source-line="19" data-link-type="dependency"><path d="M586.95,264.517 C586.95,325.317 586.95,474.967 586.95,474.967 C586.95,474.967 755.49,474.967 842.25,474.967" style="stroke:#181818;stroke-width:1;" fill="none" id="Unknown-to-Completed"/><polygon points="847.25,474.967,838.25,470.967,842.25,474.967,838.25,478.967,847.25,474.967" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="658.628" y="488.034" fill="#000" font-size="13" textLength="127.689">Biller later confirms</text><text x="612.88" y="503.167" fill="#000" font-size="13" textLength="219.185">(callback, retry or settlement file)</text></g><!--link Unknown to Failed--><g class="link" data-entity-1="ent0014" data-entity-2="ent0012" id="lnk17" data-source-line="20" data-link-type="dependency"><path d="M600.95,214.077 C600.95,182.617 600.95,132.897 600.95,132.897 C600.95,132.897 783.42,132.897 859.22,132.897" style="stroke:#181818;stroke-width:1;" fill="none" id="Unknown-to-Failed"/><polygon points="864.22,132.897,855.22,128.897,859.22,132.897,855.22,136.897,864.22,132.897" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="505.839" y="113.964" fill="#000" font-size="13" textLength="140.645">Biller later refuses, or</text><text x="460.99" y="129.097" fill="#000" font-size="13" textLength="230.344">reconciliation confirms no payment</text></g><!--link Failed to Refunded--><g class="link" data-entity-1="ent0012" data-entity-2="ent0018" id="lnk19" data-source-line="21" data-link-type="dependency"><path d="M926.6,125.297 C982.1,125.297 1093.24,125.297 1156.72,125.297" style="stroke:#181818;stroke-width:1;" fill="no